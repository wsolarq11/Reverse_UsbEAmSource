.usbeam-runtime-tooltip::before {
  content: "";
  position: absolute;
  left: var(--usbeam-tooltip-marker-inset);
  right: var(--usbeam-tooltip-marker-inset);
  top: 0;
  height: 1px;
  background: color-mix(in srgb, var(--usbeam-accent) 28%%, transparent);
}

@media (max-width: 760px) {
  .usbeam-page {
    padding: 14px;
  }

  .usbeam-grid--2 {
    grid-template-columns: 1fr;
  }
}
</style>
<script>
(function() {
  const plugin = %s;
  const callbacks = new Map();
  let callId = 1;
  let environmentPromise = null;
  let pluginEnvironment = null;
  let runtimePromise = null;
  const isEmbedded = window.parent && window.parent !== window;

  function ensureRuntime() {
    if (isEmbedded) {
      return Promise.resolve(null);
    }
    if (!runtimePromise) {
      runtimePromise = import("/wails/runtime.js");
    }
    return runtimePromise;
  }

  function parentPost(type, payload, expectReply) {
    if (!isEmbedded) {
      return Promise.reject(new Error("当前不在内嵌插件上下文中"));
    }

    if (expectReply) {
      return new Promise((resolve, reject) => {
        const id = callId++;
        callbacks.set(id, { resolve, reject });
        window.parent.postMessage({
          __usbeamPlugin: true,
          pluginId: plugin.id,
          callId: id,
          type,
          payload: payload || {}
        }, "*");
      });
    }

    window.parent.postMessage({
      __usbeamPlugin: true,
      pluginId: plugin.id,
      type,
      payload: payload || {}
    }, "*");
    return Promise.resolve(true);
  }

  async function backendCall(methodName, ...args) {
    const runtime = await ensureRuntime();
    return runtime.Call.ByName(methodName, ...args);
  }

  async function getEnvironment() {
    if (!environmentPromise) {
      environmentPromise = isEmbedded
        ? parentPost("get-environment", null, true)
        : backendCall("main.BootstrapService.GetPluginEnvironment", plugin.id);
    }
    const environment = await environmentPromise;
    pluginEnvironment = environment;
    return environment;
  }

  async function applyTheme() {
    try {
      const environment = await getEnvironment();
      let resolvedTheme = String(environment?.resolvedTheme || environment?.themeMode || "light").toLowerCase();
      if (resolvedTheme === "system") {
        resolvedTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-usbeam-theme", resolvedTheme === "dark" ? "dark" : "light");
      const tokens = environment?.tokens && typeof environment.tokens === "object" ? environment.tokens : null;
      if (tokens) {
        Object.entries(tokens).forEach(([tokenName, tokenValue]) => {
          const normalizedName = String(tokenName || "").trim();
          const normalizedValue = String(tokenValue || "").trim();
          if (!normalizedName || !normalizedValue) {
            return;
          }
          document.documentElement.style.setProperty("--usbeam-" + normalizedName, normalizedValue);
        });
      }
      applyTooltipScale(environment?.uiScalePercent);
      return environment;
    } catch (error) {
      document.documentElement.setAttribute("data-usbeam-theme", "light");
      applyTooltipScale(100);
      throw error;
    }
  }

  function normalizeTooltipText(value) {
    return String(value || "")
      .replace(/\r\n?/g, "\n")
      .split("\n")
      .map((line) => line.replace(/[ \t\f\v]+/g, " ").trim())
      .filter(Boolean)
      .join("\n");
  }

  function resolveMessage(target, key) {
    return String(key || "").split(".").reduce((result, segment) => {
      if (!result || typeof result !== "object") {
        return undefined;
      }
      return result[segment];
    }, target);
  }

  function formatMessage(template, params) {
    return Object.entries(params || {}).reduce((result, entry) => {
      return result.replaceAll("{" + entry[0] + "}", String(entry[1]));
    }, String(template || ""));
  }

  function t(key, params) {
    const fromEnvironment = resolveMessage(pluginEnvironment?.messages, key);
    const fromMeta = resolveMessage(plugin.messages, key);
    const template = typeof fromEnvironment === "string"
      ? fromEnvironment
      : typeof fromMeta === "string" ? fromMeta : String(key || "");
    return formatMessage(template, params);
  }

  function normalizeTooltipScalePercent(value) {
    const percent = Number(value);
    if (!Number.isFinite(percent) || percent <= 0) {
      return 100;
    }
    return Math.min(Math.max(percent, 50), 200);
  }

  function applyTooltipScale(uiScalePercent) {
    const scale = normalizeTooltipScalePercent(uiScalePercent) / 100;
    const rootStyle = document.documentElement.style;
    const round = (value) => Math.round(value * scale);
    rootStyle.setProperty("--usbeam-tooltip-max-width", "min(" + round(360) + "px, calc(100vw - " + round(20) + "px))");
    rootStyle.setProperty("--usbeam-tooltip-padding", round(7) + "px " + round(9) + "px");
    rootStyle.setProperty("--usbeam-tooltip-radius", round(8) + "px");
    rootStyle.setProperty("--usbeam-tooltip-font-size", (12 * scale).toFixed(2) + "px");
    rootStyle.setProperty("--usbeam-tooltip-marker-inset", round(8) + "px");
  }

  function installTooltipRuntime() {
    if (!document.body) {
      window.addEventListener("DOMContentLoaded", installTooltipRuntime, { once: true });
      return;
    }

    const tooltip = document.createElement("div");
    tooltip.className = "usbeam-runtime-tooltip";
    tooltip.hidden = true;
    tooltip.setAttribute("role", "tooltip");
    document.body.appendChild(tooltip);

    let activeElement = null;
    let lastPointer = null;
    const internalTitleRemovals = new WeakSet();
    const interactiveSelector = "button,a[href],input,select,textarea,[role='button'],[role='menuitem'],[tabindex]:not([tabindex='-1'])";

    function markInternalTitleRemoval(element) {
      internalTitleRemovals.add(element);
    }

    function clearCapturedTooltip(element) {
      element.removeAttribute("data-usbeam-tooltip");
      if (element.getAttribute("data-usbeam-tooltip-aria") === "true") {
        element.removeAttribute("aria-label");
        element.removeAttribute("data-usbeam-tooltip-aria");
      }
    }

    function captureTitle(element) {
      const rawTitle = element.getAttribute("title");
      if (rawTitle === null) {
        return normalizeTooltipText(element.getAttribute("data-usbeam-tooltip"));
      }

      const text = normalizeTooltipText(rawTitle);
      if (!text) {
        clearCapturedTooltip(element);
        return "";
      }

      element.setAttribute("data-usbeam-tooltip", text);
      if (element.matches(interactiveSelector) &&
        !element.hasAttribute("aria-labelledby") &&
        (!element.hasAttribute("aria-label") || element.getAttribute("data-usbeam-tooltip-aria") === "true")) {
        element.setAttribute("aria-label", text);
        element.setAttribute("data-usbeam-tooltip-aria", "true");
      }
      markInternalTitleRemoval(element);
      element.removeAttribute("title");
      return text;
    }

    function captureTree(root) {
      if (!root || root.nodeType !== 1) {
        return;
      }
      if (root.hasAttribute("title")) {
        captureTitle(root);
      }
      root.querySelectorAll?.("[title]").forEach(captureTitle);
    }

    function findTooltipElement(start) {
      let current = start?.nodeType === 1 ? start : start?.parentElement;
      while (current && current !== document.body) {
        if (current.closest?.("[data-usbeam-tooltip-disabled='true']")) {
          return null;
        }
        const text = normalizeTooltipText(current.getAttribute("data-usbeam-tooltip") || current.getAttribute("title"));
        if (text) {
          return current;
        }
        current = current.parentElement;
      }
      return null;
    }

    function clamp(value, min, max) {
      if (max < min) {
        return min;
      }
      return Math.min(Math.max(value, min), max);
    }

    function positionTooltip(pointer) {
      if (!activeElement) {
        return;
      }

      const rect = tooltip.getBoundingClientRect();
      const scale = normalizeTooltipScalePercent(pluginEnvironment?.uiScalePercent) / 100;
      const gap = Math.round(12 * scale);
      const margin = Math.round(10 * scale);
      let x = pointer.x + gap;
      let y = pointer.y + gap;
      if (x + rect.width + margin > window.innerWidth) {
        x = pointer.x - rect.width - gap;
      }
      if (y + rect.height + margin > window.innerHeight) {
        y = pointer.y - rect.height - gap;
      }
      tooltip.style.left = Math.round(clamp(x, margin, window.innerWidth - rect.width - margin)) + "px";
      tooltip.style.top = Math.round(clamp(y, margin, window.innerHeight - rect.height - margin)) + "px";
    }

    function showTooltip(element, pointer) {
      const text = captureTitle(element) || normalizeTooltipText(element.getAttribute("data-usbeam-tooltip"));
      if (!text) {
        hideTooltip();
        return;
      }
      activeElement = element;
      lastPointer = pointer;
      tooltip.textContent = text;
      tooltip.hidden = false;
      requestAnimationFrame(() => positionTooltip(pointer));
    }

    function hideTooltip() {
      activeElement = null;
      lastPointer = null;
      tooltip.hidden = true;
    }

    document.addEventListener("pointerover", (event) => {
      if (event.pointerType === "touch") {
        return;
      }
      const element = findTooltipElement(event.target);
      if (!element) {
        hideTooltip();
        return;
      }
      showTooltip(element, { x: event.clientX, y: event.clientY });
    }, { capture: true, passive: true });

    document.addEventListener("pointermove", (event) => {
      if (event.pointerType === "touch") {
        return;
      }
      const pointer = { x: event.clientX, y: event.clientY };
      const element = findTooltipElement(event.target);
      if (!element) {
        hideTooltip();
        return;
      }
      if (element !== activeElement) {
        showTooltip(element, pointer);
        return;
      }
      lastPointer = pointer;
      positionTooltip(pointer);
    }, { capture: true, passive: true });

    document.addEventListener("pointerout", (event) => {
      const nextElement = findTooltipElement(event.relatedTarget);
      if (nextElement !== activeElement) {
        hideTooltip();
      }
    }, { capture: true, passive: true });

    document.addEventListener("focusin", (event) => {
      const element = findTooltipElement(event.target);
      if (!element) {
        return;
      }
      const rect = element.getBoundingClientRect();
      showTooltip(element, {
        x: rect.left + rect.width / 2,
        y: rect.bottom
      });
    }, true);

    document.addEventListener("focusout", (event) => {
      if (activeElement === event.target || activeElement?.contains?.(event.target)) {
        hideTooltip();
      }
    }, true);

    window.addEventListener("scroll", hideTooltip, true);
    window.addEventListener("resize", hideTooltip);
    window.addEventListener("blur", hideTooltip);
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        hideTooltip();
      }
    }, true);

    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.type === "attributes" && mutation.attributeName === "title") {
          const element = mutation.target;
          if (element.hasAttribute("title")) {
            captureTitle(element);
            if (element === activeElement && lastPointer) {
              showTooltip(element, lastPointer);
            }
            return;
          }
          if (internalTitleRemovals.has(element)) {
            internalTitleRemovals.delete(element);
            return;
          }
          clearCapturedTooltip(element);
          if (element === activeElement) {
            hideTooltip();
          }
          return;
        }

        mutation.addedNodes.forEach(captureTree);
      });
    });

    captureTree(document.body);
    observer.observe(document.body, {
      subtree: true,
      childList: true,
      attributes: true,
      attributeFilter: ["title"]
    });
  }

  window.addEventListener("message", (event) => {
    const data = event.data;
    if (!data || !data.__usbeamHostReply) {
      return;
    }
    const cb = callbacks.get(data.callId);
    if (!cb) {
      return;
    }
    callbacks.delete(data.callId);
    if (data.error) {
      cb.reject(new Error(data.error));
      return;
    }
    cb.resolve(data.result);
  });

  function normalizeDialogResult(result, options) {
    if (Array.isArray(result)) {
      return result;
    }
    if (!result) {
      return options?.multiple ? [] : null;
    }
    return result;
  }

  function isDialogSelectionCancelled(error) {
    const message = String(error?.message || error || "").trim();
    return /\b(cancelled|canceled) by user\b/i.test(message) ||
      /\boperation (was )?(cancelled|canceled)\b/i.test(message);
  }

  async function openWindow(options) {
    const payload = {
      name: String(options?.name || "").trim(),
      entry: String(options?.entry || "").trim(),
      title: String(options?.title || "").trim(),
      mode: String(options?.mode || "").trim(),
      width: Number(options?.width || 0),
      height: Number(options?.height || 0),
      minWidth: Number(options?.minWidth || 0),
      minHeight: Number(options?.minHeight || 0),
      resizable: typeof options?.resizable === "boolean" ? options.resizable : undefined,
      frameless: typeof options?.frameless === "boolean" ? options.frameless : undefined,
      fullscreen: typeof options?.fullscreen === "boolean" ? options.fullscreen : undefined,
      alwaysOnTop: Boolean(options?.alwaysOnTop),
      hideOnEscape: typeof options?.hideOnEscape === "boolean" ? options.hideOnEscape : undefined,
      screenId: String(options?.screenId || "").trim(),
      query: String(options?.query || "").trim()
    };

    if (isEmbedded) {
      return parentPost("open-window", payload, true);
    }
    return backendCall("main.BootstrapService.OpenPluginWindow", plugin.id, payload);
  }

  async function closeWindow(name) {
    if (name) {
      if (isEmbedded) {
        return parentPost("close-window", { name: String(name).trim() }, true);
      }
      return backendCall("main.BootstrapService.ClosePluginWindow", String(name).trim());
    }

    if (isEmbedded) {
      return parentPost("close", null, true);
    }

    const runtime = await ensureRuntime();
    return runtime.Window.Close();
  }

  window.UsbEAmHost = {
    version: "1.0",
    plugin,
    t,
    getPreferences() {
      return getEnvironment();
    },
    getEnvironment() {
      return getEnvironment();
    },
    close() {
      return closeWindow("");
    },
    closeWindow(name) {
      return closeWindow(name);
    },
    async openExternal(targetURL) {
      const normalized = String(targetURL || "").trim();
      if (!normalized) {
        return false;
      }
      if (isEmbedded) {
        return parentPost("open-external", { url: normalized }, true);
      }
      const runtime = await ensureRuntime();
      await runtime.Browser.OpenURL(normalized);
      return true;
    },
    async setTitle(title) {
      const normalized = String(title || "").trim();
      if (isEmbedded) {
        return parentPost("set-title", { title: normalized }, true);
      }
      const runtime = await ensureRuntime();
      await runtime.Window.SetTitle(normalized);
      return true;
    },
    notify(eventName, payload) {
      const normalizedEventName = String(eventName || "");
      const normalizedPayload = payload || null;
      if (isEmbedded) {
        return parentPost("notify", {
          eventName: normalizedEventName,
          payload: normalizedPayload
        }, false);
      }
      return backendCall("main.BootstrapService.EmitPluginNotice", plugin.id, normalizedEventName, normalizedPayload);
    },
    async writeClipboard(text) {
      const normalized = String(text || "");
      if (isEmbedded) {
        return parentPost("write-clipboard", { text: normalized }, true);
      }
      const runtime = await ensureRuntime();
      await runtime.Clipboard.SetText(normalized);
      return true;
    },
    async readClipboard() {
      if (isEmbedded) {
        const text = await parentPost("read-clipboard", null, true);
        return String(text || "");
      }
      const runtime = await ensureRuntime();
      const text = await runtime.Clipboard.Text();
      return String(text || "");
    },
    async selectFile(options) {
      if (isEmbedded) {
        return normalizeDialogResult(await parentPost("select-file", options || {}, true), options || {});
      }
      const runtime = await ensureRuntime();
      const payload = options || {};
      if (payload.directory) {
        try {
          const result = await runtime.Dialogs.OpenFile({
            Title: payload.title || "Select Folder",
            AllowsMultipleSelection: false,
            CanChooseDirectories: true,
            CanChooseFiles: false
          });
          return result ? String(result) : null;
        } catch (error) {
          if (isDialogSelectionCancelled(error)) {
            return null;
          }
          throw error;
        }
      }
      try {
        const result = await runtime.Dialogs.OpenFile({
          Title: payload.title || "Select File",
          AllowsMultipleSelection: Boolean(payload.multiple),
          CanChooseFiles: true,
          CanChooseDirectories: false
        });
        return normalizeDialogResult(result, payload);
      } catch (error) {
        if (isDialogSelectionCancelled(error)) {
          return payload.multiple ? [] : null;
        }
        throw error;
      }
    },
    listScreens() {
      if (isEmbedded) {
        return parentPost("list-screens", null, true);
      }
      return backendCall("main.BootstrapService.ListPluginScreens");
    },
    openWindow,
    inputMonitor: {
      start(options) {
        const payload = {
          keyboard: options?.keyboard !== false,
          mouse: options?.mouse !== false
        };
        if (isEmbedded) {
          return parentPost("input-monitor-start", payload, true);
        }
        return backendCall("main.BootstrapService.StartInputMonitor", payload);
      },
      stop() {
        if (isEmbedded) {
          return parentPost("input-monitor-stop", null, true);
        }
        return backendCall("main.BootstrapService.StopInputMonitor");
      },
      snapshot(options) {
        const payload = {
          afterId: Number(options?.afterId || 0),
          limit: Number(options?.limit || 1024)
        };
        if (isEmbedded) {
          return parentPost("input-monitor-snapshot", payload, true);
        }
        return backendCall("main.BootstrapService.GetInputMonitorSnapshot", payload.afterId, payload.limit);
      }
    },
    window: {
      async api() {
        if (!isEmbedded) {
          const runtime = await ensureRuntime();
          return runtime.Window;
        }
        return {
          ToggleFullscreen() {
            return parentPost("native-window", { method: "ToggleFullscreen" }, true);
          },
          IsFullscreen() {
            return parentPost("native-window", { method: "IsFullscreen" }, true);
          },
          Fullscreen() {
            return parentPost("native-window", { method: "Fullscreen" }, true);
          },
          UnFullscreen() {
            return parentPost("native-window", { method: "UnFullscreen" }, true);
          }
        };
      }
    },
    screens: {
      getAll() {
        if (isEmbedded) {
          return parentPost("native-screens", { method: "GetAll" }, true);
        }
        return ensureRuntime().then((runtime) => runtime.Screens.GetAll());
      },
      getPrimary() {
        if (isEmbedded) {
          return parentPost("native-screens", { method: "GetPrimary" }, true);
        }
        return ensureRuntime().then((runtime) => runtime.Screens.GetPrimary());
      },
      getCurrent() {
        if (isEmbedded) {
          return parentPost("native-screens", { method: "GetCurrent" }, true);
        }
        return ensureRuntime().then((runtime) => runtime.Screens.GetCurrent());
      }
    }
  };

  function dispatchPluginReady() {
    window.dispatchEvent(new CustomEvent("usbeam-plugin-ready", {
      detail: { plugin }
    }));
  }

  function schedulePluginReady() {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", dispatchPluginReady, { once: true });
      return;
    }
    dispatchPluginReady();
  }

    applyTheme()
    .catch(() => null)
    .finally(() => {
      installTooltipRuntime();
      schedulePluginReady();
    });
})();
</script>
